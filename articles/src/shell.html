<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  @font-face { font-family: "Geist"; src: url(data:font/woff2;base64,__GEIST__) format("woff2"); font-weight: 100 900; font-display: block; }
  /* Same tokens as the case studies and the homepage. Container queries drive the layout so the
     Phone switch shows the true phone layout at any window size. */
  :root {
    --ink: #000; --body: #333; --muted: #676767; --line: #e5e7e8; --panel: #f4f4f5; --card: #f9f9f9; --tag: #eceef0; --draft: #b25e00;
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --expo: cubic-bezier(0.19, 1, 0.22, 1);
    --read: 680px;   /* the reading column */
    --wide: 960px;   /* figures that need more room */
    --media: 1120px; /* header panel and cover */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  *, ::before, ::after { letter-spacing: -0.01em; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  figure { margin: 0; }
  strong { font-weight: 500; color: var(--ink); }
  button { font: inherit; letter-spacing: inherit; color: inherit; }
  img, video { display: block; max-width: 100%; height: auto; }
  .todo { color: var(--draft); }

  .viewport { container-type: inline-size; margin-inline: auto; background: #fff; min-height: 100vh; }
  body.phone { background: #ececee; }
  body.phone .viewport { max-width: 390px; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.08); }
  .page { max-width: 1512px; margin: 0 auto; padding: 0 16px 96px; }
  @container (min-width: 640px) { .page { padding-inline: 24px; } }
  @container (min-width: 1024px) { .page { padding-inline: 36px; padding-bottom: 120px; } }
  .topnav { display: flex; justify-content: space-between; align-items: center; height: 76px; font-size: 14px; line-height: 24px; }
  .topnav nav { display: flex; gap: 20px; }
  @container (min-width: 640px) { .topnav nav { gap: 28px; } }

  /* ---------- Header panel: the homepage article card, grown to the width of the page ---------- */
  .wrap { max-width: var(--media); margin-inline: auto; }
  .back { display: inline-block; margin: 4px 0 14px; font-size: 13px; line-height: 20px; color: var(--muted); transition: color .2s; }
  .back:hover { color: var(--ink); }
  .ahead { position: relative; isolation: isolate; display: flex; flex-direction: column; min-height: 360px; padding: 16px; }
  @container (min-width: 640px) { .ahead { min-height: 420px; padding: 20px 24px; } }
  @container (min-width: 1024px) { .ahead { min-height: 480px; padding: 24px 32px; } }
  .ahead-bg { position: absolute; inset: 0; z-index: -1; border-radius: 8px; background: var(--card); transform-origin: top center; }
  .ahead .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .tagpill { display: inline-block; border-radius: 4px; background: var(--tag); padding: 4px 8px; font-size: 11px; line-height: 16px; color: #333; }
  .ahead h1 { margin: auto 0 0; padding-top: 56px; max-width: 900px; font-size: 32px; line-height: 36px; font-weight: 400; letter-spacing: -0.03em; text-wrap: balance; }
  @container (min-width: 640px) { .ahead h1 { font-size: 44px; line-height: 48px; letter-spacing: -0.035em; } }
  @container (min-width: 1024px) { .ahead h1 { font-size: 56px; line-height: 60px; letter-spacing: -0.04em; } }
  .ahead .dek { margin: 14px 0 0; max-width: 620px; font-size: 17px; line-height: 26px; color: var(--body); text-wrap: pretty; }
  @container (min-width: 640px) { .ahead .dek { font-size: 19px; line-height: 28px; } }
  .ahead .by { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--line); }
  @container (max-width: 520px) { .ahead .by { flex-direction: column; align-items: flex-start; gap: 0; } }
  .cover { margin-top: 16px; border-radius: 12px; overflow: hidden; background: var(--card); }
  .cover img { width: 100%; }
  .cover-cap { margin-top: 10px; font-size: 13px; line-height: 20px; color: var(--muted); }

  /* ---------- The reading column; figures may step out to the wide measure ---------- */
  .prose { display: grid; grid-template-columns: [wide-start] minmax(0, 1fr) [text-start] minmax(0, var(--read)) [text-end] minmax(0, 1fr) [wide-end]; margin-top: 56px; }
  @container (min-width: 1024px) { .prose { margin-top: 80px; } }
  .prose > * { grid-column: text; margin: 0; }
  .prose > .wide { grid-column: wide; width: 100%; max-width: var(--wide); justify-self: center; }
  .prose p, .prose li { font-size: 17px; line-height: 28px; color: var(--body); text-wrap: pretty; }
  @container (min-width: 640px) { .prose p, .prose li { font-size: 18px; line-height: 30px; } }
  .prose > .lede { font-size: 20px; line-height: 31px; color: var(--ink); }
  @container (min-width: 640px) { .prose > .lede { font-size: 22px; line-height: 34px; letter-spacing: -0.015em; } }
  .prose > * + p, .prose > * + ul, .prose > * + ol { margin-top: 20px; }
  .prose h2 { margin-top: 64px; font-size: 24px; line-height: 30px; font-weight: 500; letter-spacing: -0.02em; text-wrap: balance; scroll-margin-top: 32px; }
  @container (min-width: 640px) { .prose h2 { margin-top: 80px; font-size: 28px; line-height: 34px; letter-spacing: -0.025em; } }
  .prose h2 + * { margin-top: 16px !important; }
  .prose h3 { margin-top: 40px; font-size: 19px; line-height: 28px; font-weight: 500; letter-spacing: -0.015em; }
  .prose h3 + * { margin-top: 8px !important; }
  .prose ul, .prose ol { padding-left: 22px; }
  .prose > ul > li + li, .prose > ol > li + li { margin-top: 10px; }
  .prose a.inl { color: var(--ink); text-decoration: underline; text-decoration-color: #c5c9cd; text-underline-offset: 4px; transition: text-decoration-color .2s; }
  .prose a.inl:hover { text-decoration-color: var(--ink); }
  .prose > figure, .prose > blockquote { margin-top: 40px; margin-bottom: 8px; }
  .prose > figure + p, .prose > blockquote + p, .prose > figure + h3 { margin-top: 40px; }
  .prose > figure + h2, .prose > blockquote + h2 { margin-top: 72px; }
  .prose blockquote { padding: 2px 0 2px 20px; border-left: 2px solid var(--ink); }
  .prose blockquote p { font-size: 21px; line-height: 31px; color: var(--ink); letter-spacing: -0.015em; }
  .prose blockquote p { margin: 0; }
  .prose blockquote cite { display: block; margin-top: 10px; font-style: normal; font-size: 13px; line-height: 20px; color: var(--muted); }
  .prose blockquote.todo-q { border-left-color: var(--draft); }
  .prose blockquote.todo-q p, .prose blockquote.todo-q cite { color: var(--draft); }
  .caption { margin-top: 12px; font-size: 13px; line-height: 20px; color: var(--muted); text-wrap: pretty; }
  .wide > .caption { max-width: var(--read); }
  .frame { border-radius: 12px; overflow: hidden; background: var(--panel); }
  .frame.dark { background: #212121; }
  .ph { display: grid; place-items: center; min-height: 140px; padding: 24px; border-radius: 12px; border: 1px dashed #e0c3a3; background: #fdf8f3; color: var(--draft); font-size: 14px; line-height: 21px; text-align: center; text-wrap: balance; }

  /* Stat: the headline change, said once, big */
  .stat { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat .from { font-size: 28px; line-height: 34px; color: #a3a7ab; letter-spacing: -0.03em; }
  .stat .arr { font-size: 22px; color: #a3a7ab; }
  .stat .to { font-size: 28px; line-height: 34px; letter-spacing: -0.03em; }
  @container (min-width: 640px) { .stat .from, .stat .to { font-size: 40px; line-height: 44px; } }
  .stat .what { flex-basis: 100%; font-size: 13px; line-height: 20px; color: var(--muted); }

  /* ---------- Tabs: one figure, several views; the frame eases to each view's height ---------- */
  .tablist { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: var(--panel); margin-bottom: 12px; }
  .tablist button { border: 0; background: transparent; height: 32px; padding: 0 14px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; transition: color .2s, background-color .2s, box-shadow .2s; }
  .tablist button:hover { color: var(--ink); }
  .tablist button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.03); }
  .tablist button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .tab-stage { position: relative; transition: height .55s var(--expo); }
  .tab-panel { transition: opacity .35s ease; }
  /* On phones the skill text would be too small to read, so the screenshot keeps a readable size and scrolls sideways */
  @container (max-width: 639px) { .frame.dark { overflow-x: auto; scrollbar-width: thin; } .frame.dark img { width: 620px; max-width: none; } }
  .tab-panel:not(.on) { position: absolute; inset: 0 0 auto; opacity: 0; visibility: hidden; pointer-events: none; }

  /* Video pair */
  .clips { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @container (min-width: 640px) { .clips { grid-template-columns: 1fr 1fr; } }
  .clip { position: relative; display: grid; place-items: center; padding: 52px 24px 24px; border-radius: 12px; overflow: hidden; background: var(--panel); }
  .clip video { width: auto; max-width: 100%; max-height: 520px; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .clip .lab, .duo .lab { position: absolute; left: 12px; top: 12px; z-index: 1; border-radius: 999px; padding: 4px 10px; background: rgba(255,255,255,.94); font-size: 12px; line-height: 16px; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

  /* Explored vs shipped */
  .duo { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @container (min-width: 640px) { .duo { grid-template-columns: 1.15fr 1fr; } }
  .duo .cell { position: relative; display: grid; place-items: center; padding: 52px 24px 24px; border-radius: 12px; background: var(--panel); }
  .duo .cell img { max-height: 440px; width: auto; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
  .duo .cell.explored img { opacity: .9; }

  /* ---------- Table of contents: the case-study index, fixed beside the column on wide screens ---------- */
  .toc { display: none; }
  @container (min-width: 1360px) {
    .toc { display: block; position: fixed; top: 112px; left: max(36px, calc((100vw - 1512px) / 2 + 36px)); width: 184px; opacity: 0; translate: 0 8px; pointer-events: none; transition: opacity .4s ease, translate .6s var(--expo); }
    .toc.on { opacity: 1; translate: 0 0; pointer-events: auto; }
  }
  .toc .lab { font-size: 13px; line-height: 20px; color: var(--muted); }
  .toc ol { position: relative; list-style: none; margin: 12px 0 0; padding: 0; border-left: 1px solid var(--line); }
  .toc a { display: block; padding: 6px 0 6px 14px; font-size: 13px; line-height: 18px; color: var(--muted); transition: color .2s; }
  .toc a:hover, .toc a.on { color: var(--ink); }
  .toc .marker { position: absolute; left: -1px; top: 0; width: 1px; height: 0; background: var(--ink); transition: top .5s var(--expo), height .5s var(--expo); }

  /* ---------- End of the article ---------- */
  .end { max-width: var(--media); margin: 104px auto 0; padding-top: 24px; border-top: 1px solid var(--line); }
  .end .lab { font-size: 14px; line-height: 24px; color: var(--muted); }
  .end .grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 12px; }
  @container (min-width: 768px) { .end .grid { grid-template-columns: 1fr 1fr; gap: 30px; } }
  /* The same card as the homepage, so the next article opens the same way */
  .acard { position: relative; isolation: isolate; display: flex; flex-direction: column; min-height: 159px; padding: 16px; }
  .acard .card-bg { position: absolute; inset: 0; z-index: -1; border-radius: 8px; background: var(--card); transition: background-color .3s ease; }
  @media (hover: hover) { .acard:hover .card-bg { background: #f1f2f3; } }
  .acard .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .acard h3 { margin: 16px 0 0; max-width: 381px; font-size: 16px; line-height: 1.2; font-weight: 400; }
  .acard .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-top: auto; padding-top: 24px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .acard .go { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 16px; color: var(--ink); }
  .acard .go i { font-style: normal; transition: transform .3s var(--expo); }
  .acard:hover .go i { transform: translateX(3px); }
  .homecard { display: flex; flex-direction: column; justify-content: space-between; min-height: 159px; padding: 16px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; line-height: 20px; color: var(--muted); transition: border-color .2s; }
  .homecard:hover { border-color: #c5c9cd; }
  .homecard strong { display: block; margin-top: 16px; font-size: 16px; line-height: 1.2; font-weight: 400; }
  .homecard .go { align-self: flex-end; font-size: 14px; line-height: 16px; color: var(--ink); }

__DIAGRAMS__

  /* ---------- Motion: only landmarks move; reading text is never held back ---------- */
  .sl .line { display: block; overflow: clip; padding-bottom: .12em; margin-bottom: -.12em; }
  .sl .li { display: block; }
  html.motion .sl .li { transform: translateY(105%); }
  html.motion .sl.in .li { transform: none; transition: transform 750ms var(--expo) calc(var(--d, 0ms) + var(--i, 0) * 70ms); }
  html.motion .rv { transform: translateY(12px); opacity: 0; }
  html.motion .rv.in { transform: none; opacity: 1; transition: transform .75s var(--expo) var(--d, 0ms), opacity .75s var(--expo) var(--d, 0ms); }
  /* The grey panel sweeps down like the homepage card, then its words rise */
  html.motion .ahead-bg { transform: scaleY(0); }
  html.motion .ahead-bg.in { transform: none; transition: transform 900ms var(--expo); }
  /* Images wipe up once */
  html.motion .m { clip-path: inset(100% 0 0 0 round 12px); }
  html.motion .m.in { clip-path: inset(0 round 12px); transition: clip-path 1.1s var(--expo) var(--d, 0ms); }
  html.motion .m img { transform: scale(1.04); }
  html.motion .m.in img { transform: none; transition: transform 1.6s var(--expo) var(--d, 0ms); }
  .instant, .instant * { transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .tab-stage, .tab-panel { transition: none; } }

  /* Prototype controls (preview only, never part of the site) */
  .ctrl { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 50; display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: #111; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2); transition: translate .5s var(--expo); }
  .ctrl.away { translate: -50% calc(100% + 24px); }
  .ctrl .grp { display: flex; gap: 2px; }
  .ctrl .sep { width: 1px; margin: 4px 4px; background: #333; }
  .ctrl button { white-space: nowrap; border: 0; background: transparent; color: #cfcfcf; height: 28px; padding: 0 12px; border-radius: 8px; cursor: pointer; }
  .ctrl button[aria-pressed="true"] { background: #fff; color: #000; }
  .ctrl button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
</style>

<div class="viewport"><div class="page">
  <header class="topnav"><a href="#" data-home>Olaide</a><nav><a href="#">About</a><a href="#">Contact</a><a href="#">Resume</a></nav></header>

  <nav class="toc" id="toc" aria-label="In this article"><div class="lab">In this article</div><ol id="toc-list"></ol></nav>

  <main>
__PAGE__
  </main>
</div></div>

<div class="ctrl" id="ctrl" role="group" aria-label="Prototype controls"><span class="grp" id="g-motion"><button data-v="on" aria-pressed="true">Motion on</button><button data-v="off" aria-pressed="false">Off</button></span><span class="sep"></span><span class="grp" id="g-view"><button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="phone" aria-pressed="false">Phone</button></span></div>

<script>
(() => {
  const html = document.documentElement;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let motion = !reduced;
  html.classList.toggle("motion", motion);

  // ---------- Headings: split into measured lines so each can rise from its own mask ----------
  const splits = [...document.querySelectorAll(".sl")].map((el) => ({ el, text: el.textContent.trim() }));
  function splitLines() {
    splits.forEach(({ el, text }) => {
      el.innerHTML = text.split(" ").map((w) => `<span data-w>${w}</span>`).join(" ");
      const lines = []; let top = null;
      el.querySelectorAll("[data-w]").forEach((w) => { if (w.offsetTop !== top) { lines.push([]); top = w.offsetTop; } lines[lines.length - 1].push(w.textContent); });
      el.innerHTML = lines.map((l, i) => `<span class="line"><span class="li" style="--i:${i}">${l.join(" ")}</span></span>`).join("");
      el.setAttribute("aria-label", text);
    });
  }
  splitLines();
  document.fonts?.ready.then(splitLines);
  let lastW = innerWidth, rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; splitLines(); sizeTabs(); } }, 150); });

  // ---------- Table of contents ----------
  const heads = [...document.querySelectorAll(".prose h2[id]")];
  const tocList = document.getElementById("toc-list"), toc = document.getElementById("toc");
  tocList.innerHTML = heads.map((h) => `<li><a href="#${h.id}">${h.dataset.toc || h.textContent.trim()}</a></li>`).join("");
  const marker = document.createElement("span"); marker.className = "marker"; tocList.appendChild(marker);
  const prose = document.querySelector(".prose");
  function onScroll() {
    let cur = -1; heads.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight * 0.35) cur = i; });
    tocList.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === cur));
    const a = tocList.querySelector("a.on");
    if (a) { marker.style.top = a.offsetTop + "px"; marker.style.height = a.offsetHeight + "px"; } else marker.style.height = "0";
    const r = prose.getBoundingClientRect();
    toc.classList.toggle("on", r.top < innerHeight * 0.5 && r.bottom > innerHeight * 0.4);
    const ctrl = document.getElementById("ctrl"); if (ctrl) ctrl.classList.toggle("away", innerHeight + scrollY > document.documentElement.scrollHeight - 140);
  }
  addEventListener("scroll", onScroll, { passive: true });

  // ---------- Tabs ----------
  const tabsets = [...document.querySelectorAll("[data-tabs]")];
  function sizeTabs() { tabsets.forEach((t) => { const st = t.querySelector(".tab-stage"); st.style.height = t.querySelector(".tab-panel.on").offsetHeight + "px"; }); }
  tabsets.forEach((t) => {
    const btns = [...t.querySelectorAll("[role=tab]")], panels = [...t.querySelectorAll(".tab-panel")], cap = t.querySelector(".caption[aria-live]");
    const pick = (i, focus) => {
      btns.forEach((b, j) => { b.setAttribute("aria-selected", String(i === j)); b.tabIndex = i === j ? 0 : -1; });
      panels.forEach((p, j) => p.classList.toggle("on", i === j));
      if (cap) cap.innerHTML = panels[i].dataset.caption;
      if (focus) btns[i].focus();
      sizeTabs();
    };
    btns.forEach((b, i) => b.addEventListener("click", () => pick(i)));
    t.querySelector("[role=tablist]").addEventListener("keydown", (e) => {
      const i = btns.indexOf(document.activeElement); if (i < 0) return;
      if (e.key === "ArrowRight") { e.preventDefault(); pick((i + 1) % btns.length, true); }
      if (e.key === "ArrowLeft") { e.preventDefault(); pick((i - 1 + btns.length) % btns.length, true); }
    });
    t.querySelectorAll("img").forEach((im) => im.addEventListener("load", sizeTabs));
  });
  sizeTabs();

  // ---------- Clips play only while on screen ----------
  document.querySelectorAll(".clip video").forEach((v) => {
    new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }), { threshold: 0.25 }).observe(v);
  });

  // ---------- Reveal ----------
  function reveal(el, instant) {
    if (instant) el.classList.add("instant");
    el.classList.add("in");
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("instant")));
  }
  const targets = () => document.querySelectorAll(".sl, .rv, .m, .ahead-bg, .dg");
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { reveal(e.target, !motion); io.unobserve(e.target); } }), { rootMargin: "0px 0px -10% 0px" });
  function arm() { targets().forEach((el) => (motion ? io.observe(el) : reveal(el, true))); }
  arm();

  // ---------- Prototype controls ----------
  const group = (id, fn) => { const g = document.getElementById(id); if (!g) return; g.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); fn(b.dataset.v); }); };
  group("g-view", (v) => { document.body.classList.toggle("phone", v === "phone"); splitLines(); sizeTabs(); onScroll(); });
  group("g-motion", (v) => {
    motion = v === "on"; html.classList.toggle("motion", motion);
    targets().forEach((el) => { io.unobserve(el); el.classList.remove("in", "instant"); });
    arm();
  });
  onScroll();
})();
</script>
